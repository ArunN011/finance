<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stackly Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

    
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">


<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">



    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="loader.css">
     <link rel="stylesheet" href="cursor.css">

</head>

<body>


<div id="preloader">

    <div class="loader-wrapper">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>

        <div class="finance-logo">

    <img src="greenlogostackly.png"
         alt="Stackly Finance Logo"
         class="loader-logo">

</div>

    </div>

    <h2 class="loader-title">
        Stackly Finance
    </h2>

    <p class="loader-text">
        Securing Your Financial Future...
    </p>

</div>




<div class="cursor-dot"></div>
<div class="cursor-ring"></div>
  

<div id="website">


<section class="login-section">

    <div class="login-grid"></div>

    <div class="login-glow"></div>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-xl-5 col-lg-6 col-md-8">

                <div class="login-card">

                 

                    <a href="index.html"
                       class="back-home">

                        <i class="ri-arrow-left-line"></i>

                        Back To Home

                    </a>

                

                    <div class="login-logo">

                        <img src="greenlogostackly.png"
                             alt="Stackly">

                    </div>

                

                    <div class="login-heading">

                        <h2>

                            Welcome Back

                        </h2>

                        <p>

                            Sign in to access your secure finance dashboard.

                        </p>

                    </div>

                  
                    <div class="role-selector">

                        <button type="button"

                                class="role-btn active"

                                data-role="user">

                            <i class="ri-user-3-line"></i>

                            User

                        </button>

                        <button type="button"

                                class="role-btn"

                                data-role="admin">

                            <i class="ri-shield-user-line"></i>

                            Admin

                        </button>

                    </div>

                  

                    <form id="loginForm">

                       

                        <div class="form-group">

                            <label>

                                Email Address

                            </label>

                            <div class="input-box">

                                <i class="ri-mail-line"></i>

                                <input

                                    type="email"

                                    id="loginEmail"

                                    class="form-control"

                                    placeholder="Enter your email"

                                    required>

                            </div>

                        </div>

                       

                        <div class="form-group mt-4">

                            <label>

                                Password

                            </label>

                            <div class="input-box">

                                <i class="ri-lock-password-line"></i>

                                <input

                                    type="password"

                                    id="loginPassword"

                                    class="form-control"

                                    placeholder="Enter your password"

                                    required>

                                <button

                                    type="button"

                                    id="togglePassword"

                                    class="password-toggle">

                                    <i class="ri-eye-line"></i>

                                </button>

                            </div>

                        </div>

                        

                        <div class="login-options">

                            <label class="remember-me">

                                <input type="checkbox">

                                Remember Me

                            </label>

                            <a href="error.html">

                                Forgot Password?

                            </a>

                        </div>

                        

                        <button

                            type="submit"

                            class="login-btn"

                            id="loginButton">

                            <span class="login-text">

                                Login

                            </span>

                            <span class="login-loader">

                                <i class="ri-loader-4-line"></i>

                            </span>

                        </button>

                    </form>

                   

                    <div class="login-footer">

                        <p>

                            Don't have an account?

                            <a href="signup.html">

                                Create Account

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
<script src="loader.js"></script>
<script src="cursor.js"></script>
<script>
   

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const togglePassword =
document.getElementById("togglePassword");

const togglePasswordIcon =
togglePassword.querySelector("i");

const roleButtons =
document.querySelectorAll(".role-btn");

let selectedRole = "user";


roleButtons.forEach(button=>{

button.addEventListener("click",()=>{

roleButtons.forEach(btn=>{

btn.classList.remove("active");

});

button.classList.add("active");

selectedRole =
button.dataset.role;

});

});


togglePassword.addEventListener("click",()=>{

if(loginPassword.type==="password"){

loginPassword.type="text";

togglePasswordIcon.className=
"ri-eye-off-line";

}

else{

loginPassword.type="password";

togglePasswordIcon.className=
"ri-eye-line";

}

});


function validateLogin(){

const email =
loginEmail.value.trim();

const password =
loginPassword.value.trim();

const emailPattern =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(email===""){

alert("Please enter your Email Address.");

loginEmail.focus();

return false;

}

if(!emailPattern.test(email)){

alert("Please enter a valid Email.");

loginEmail.focus();

return false;

}

if(password===""){

alert("Please enter your Password.");

loginPassword.focus();

return false;

}

if(password.length<8){

alert("Password must contain at least 8 characters.");

loginPassword.focus();

return false;

}

return true;

}


loginForm.addEventListener("submit",(event)=>{

event.preventDefault();

if(!validateLogin()){

return;

}


localStorage.setItem(

"userEmail",

loginEmail.value.trim()

);

localStorage.setItem(

"userRole",

selectedRole

);



loginButton.classList.add("loading");

loginButton.disabled=true;



setTimeout(()=>{

if(selectedRole==="admin"){

window.location.href=

"admin-dashboard.html";

}

else{

window.location.href=

"user-dashboard.html";

}

},2000);

});
</script>
</body>
</html>
